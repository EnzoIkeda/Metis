name: CI

on:
  push:
    branches: [main, features/beta]
  pull_request:
    branches: [main, features/beta]

jobs:
  lint:
    name: Lint (dotnet format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet format Tests/Metis.Core.Tests --verify-no-changes

  core-tests:
    name: Tests (Metis.Core.Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Tests/Metis.Core.Tests

# Sem job pros testes EditMode do Unity Test Framework: Unity restringe ativacao manual offline a seats Enterprise/Industry, entao uma conta Personal nao ativa licenca sem interacao humana num runner hospedado, e self-hosted exporia a maquina a codigo de PR de fork num repo publico; rodar localmente antes de cada push/PR fica como pratica manual.
